    .app-wrapper {
      width: 100%;
      min-height: 100vh;
      background:
                radial-gradient(at 20% 30%, rgba(255, 221, 240, 1) 0px, transparent 50%),
                radial-gradient(at 80% 20%, rgba(232, 221, 255, 1) 0px, transparent 50%),
                radial-gradient(at 40% 70%, rgba(214, 255, 245, 1) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(201, 231, 255, 1) 0px, transparent 50%),
                radial-gradient(at 10% 90%, rgba(255, 233, 216, 1) 0px, transparent 50%);
                background-size: 200% 200%;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      animation: ribbonFlow 4s ease infinite;
      transition: 180ms ease-out;
}

@keyframes ribbonFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }

}
   

    .floating-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .float-element {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: float 10s infinite ease-in-out;
    }

    .float-element:nth-child(1) {
      width: 250px;
      height: 250px;
      top: -2%;
      left: 2%;
      animation-delay: 0s;
    }

    .float-element:nth-child(2) {
      width: 150px;
      height: 150px;
      top:70%;
      right: 10%;
      animation-delay: -5s;
    }

    .float-element:nth-child(3) {
      width: 200px;
      height: 200px;
      bottom: 20%;
      left: 10%;
      animation-delay: -10s;
    }
    
    .float-element:nth-child(4) {
      width: 230px;
      height: 230px;
      bottom: 50%;
      left: 55%;
      animation-delay: -7s;
    }
    
    .float-element:nth-child(5) {
      width: 250px;
      height: 250px;
      bottom: -5%;
      left: 45%;
      animation-delay: -5s;
    }

  .float-element:nth-child(6) {
      width: 150px;
      height: 150px;
      bottom: 82%;
      left: 65%;
      animation-delay: -5s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-40px) rotate(5deg); }
      50% { transform: translateY(-70px) rotate(-5deg); }
      75% { transform: translateY(-40px) rotate(3deg); }
    }

    .nav-btn {
	font-size: 1.1rem;
	color: #4f4f4f;
font-family: 'Cormorant Garamond', serif;
  text-shadow: 0 2px 2px rgba(54, 54, 54, 0.2);
	background-image: conic-gradient(from 45deg at 50% 50%, rgba(255, 221, 240, 1) 0deg, rgba(255, 255, 255, 1) 87deg, rgba(232, 221, 255, 1) 178deg, rgba(214, 255, 245, 1) 250deg, rgba(201, 231, 255, 1) 307deg, rgba(255, 221, 221, 1) 360deg); 
	background-repeat: no-repeat;
	background-position: center;
	background-size: 200% 200%;
	padding: 8px 14px;
	border-radius: 30px;
	border: 1px solid rgba(255,255,255,0.1);
	box-shadow: 0 12px 24px -7px rgba(0, 0, 0, 0.17);
	position: relative;
overflow: hidden;
	transition: all 0.5s ease;
margin-bottom: 3px;
	cursor: pointer;
	display: inline-flex;
	justify-content: center;
	align-items: center;
}



.nav-btn::before,
.nav-btn::after {
	content: "";
	inset: 0;
	position: absolute;
	border-radius: 30px;
}



.nav-btn::before {
	background-image: radial-gradient(ellipse, rgba(204, 246, 255, 0.8) 20%, transparent 50%, transparent 200%), linear-gradient(90deg, #404040 -10%, transparent 30%, transparent 70%, #404040 110%);
	box-shadow: inset 0 0.25em 0.75em rgba(0, 0, 0, 0.8), inset 0 -0.05em 0.2em rgba(255, 255, 255, 0.4), inset 0 -1px 3px rgba(25, 196, 230, 0.75);
	background-blend-mode: overlay;
	background-repeat: no-repeat;
	background-size: 200% 80%, cover;
	background-position: center 220%;
	mix-blend-mode: overlay;
	filter: blur(0);
}



.nav-btn::after {
	background-image:linear-gradient(180deg, rgba(213, 204, 255, 0.726), rgba(92, 74, 181, 0.75) 40%, transparent 80%);
	top: 0.075em;
	left: 0.75em;
	right: 0.75em;
	bottom: 1.4em;
	filter: blur(1px);
	mix-blend-mode: screen;
}



.nav-btn:hover,
.nav-btn:active,
.nav-btn:focus {
	border: 1px solid rgba(255,255,255,0.1);
	box-shadow: 0px 48px 100px 0px rgba(0, 0, 0, 0.2);
	background-position: center calc(45% - 0.75em);
}

    .checklist-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .checklist-item {
      background: rgba(255, 255, 255, 0.7);
box-shadow: 0 12px 24px rgba(0, 0, 0, 0.17);
border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
  

    .checklist-item.checked {
      opacity: 0.7;
      background: rgba(255, 221, 240, 0.4);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .checkbox-wrapper {
      position: relative;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .checkbox {
      width: 30px;
      height: 30px;
      border: 3px solid #D6FFF5;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox.checked {
      background: conic-gradient(from 45deg at 50% 50%, rgba(255, 221, 240, 1) 0deg, rgba(255, 255, 255, 1) 87deg, rgba(232, 221, 255, 1) 178deg, rgba(214, 255, 245, 1) 250deg, rgba(201, 231, 255, 1) 307deg, rgba(255, 221, 221, 1) 360deg);
      border-color: #B3F5E6;
    }

    .checkbox svg {
      width: 20px;
      height: 20px;
      fill: #4f4f4f;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .checkbox.checked svg {
      opacity: 1;
    }

    .item-thumbnail {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
border: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .item-thumbnail:hover {
      transform: scale(1.05);
    }

        <select id="fontSizeSelect" class="form-select">
          <option value="14">Small</option>
          <option value="16" selected>Medium</option>
          <option value="18">Large</option>
          <option value="20">Extra Large</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Theme</label>
        <select id="themeSelect" class="form-select">
          <option value="light">Light Mode</option>
          <option value="dark">Dark Mode</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn" id="closeSettingsBtn">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
/* ================================
   WISHLIST APP — CLEAN JS REBUILD
   ================================ */

let items = [];
let currentFilter = "all";
let editingItemId = null;

/* -------------------------------
   Toast Notification
--------------------------------*/
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("active");
  setTimeout(() => toast.classList.remove("active"), 3000);
}

/* -------------------------------
   Local Storage
--------------------------------*/
function saveToLocalStorage() {
  try {
    localStorage.setItem("wishlistItems", JSON.stringify(items));
    return true;
  } catch (e) {
    showToast("Failed to save data");
    return false;
  }
}

function loadFromLocalStorage() {
  try {
    const stored = localStorage.getItem("wishlistItems");
    if (stored) {
      items = JSON.parse(stored);
      items.sort((a, b) => (a.order || 0) - (b.order || 0));
    }
    renderChecklist();
    updateProgress();
  } catch (e) {
    showToast("Failed to load data");
  }
}

/* -------------------------------
   Render Checklist
--------------------------------*/
function renderChecklist() {
  const container = document.getElementById("checklistContainer");

  const filteredItems =
    currentFilter === "all"
      ? items
      : items.filter((item) => item.category === currentFilter);

  if (filteredItems.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
        <p>No items yet. Click "Add Item" to get started!</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filteredItems
    .map((item) => {
      return `
        <div class="checklist-item ${item.checked ? "checked" : ""}" data-id="${item.id}">
          <div class="item-header">
            <div class="checkbox-wrapper">
              <div class="checkbox ${item.checked ? "checked" : ""}" data-id="${item.id}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>

            ${
              item.imageData
                ? `<img src="${item.imageData}" class="item-thumbnail" data-view-image="${item.id}">`
                : ""
            }

            <div class="item-content">
              <h3 class="item-title">${item.title}</h3>
              <span class="item-category">${item.category}</span>

              ${
                item.description
                  ? `<p class="item-description">${item.description}</p>`
                  : ""
              }

              <div class="item-meta">
                ${item.price ? `<span>Price: ${item.price}</span>` : ""}
                ${item.quantity ? `<span>Qty: ${item.quantity}</span>` : ""}
                ${
                  item.url
                    ? `<span>${
                        item.url.startsWith("http")
                          ? `<a href="${item.url}" target="_blank" style="color:#8fcdff;text-decoration:underline;">Link</a>`
                          : item.url
                      }</span>`
                    : ""
                }
                ${item.mustHave ? `<span>🩷 Must Have</span>` : ""}
              </div>
            </div>
          </div>

          <div class="item-actions">
            ${
              item.notes
                ? `<button class="action-btn" data-view-notes="${item.id}">📖 View Notes</button>`
                : ""
            }
            <button class="action-btn" data-edit-item="${item.id}">📝 Edit</button>
            <button class="action-btn" data-delete-item="${item.id}">🗑️ Delete</button>
          </div>
        </div>
      `;
    })
    .join("");
}

/* -------------------------------
   Progress Bar
--------------------------------*/
function updateProgress() {
  const total = items.length;
  const completed = items.filter((i) => i.checked).length;
  const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById("progressBar").style.width = percentage + "%";
  document.getElementById("progressText").textContent = percentage + "%";
}

/* -------------------------------
   Toggle Item Checked
--------------------------------*/
function toggleItem(id) {
  const item = items.find((i) => i.id === id);
  if (!item) return;

  item.checked = !item.checked;

  if (saveToLocalStorage()) {
    renderChecklist();
    updateProgress();
  }
}

/* -------------------------------
   Open Add/Edit Modal
--------------------------------*/
function openItemModal(editItem = null) {
  editingItemId = editItem ? editItem.id : null;

  const form = document.getElementById("itemForm");
  const preview = document.getElementById("imagePreview");

  form.reset();
  preview.style.display = "none";

  if (editItem) {
    document.getElementById("modalTitle").textContent = "Edit Item";

    document.getElementById("itemTitle").value = editItem.title || "";
    document.getElementById("itemCategory").value = editItem.category || "Other";
    document.getElementById("itemPrice").value = editItem.price || "";
    document.getElementById("itemQuantity").value = editItem.quantity || 1;
    document.getElementById("itemUrl").value = editItem.url || "";
    document.getElementById("itemMustHave").checked = !!editItem.mustHave;
    document.getElementById("itemDescription").value = editItem.description || "";
    document.getElementById("itemNotes").value = editItem.notes || "";

    if (editItem.imageData) {
      preview.src = editItem.imageData;
      preview.style.display = "block";
    }
  } else {
    document.getElementById("modalTitle").textContent = "Add New Item";
  }

  document.getElementById("itemModal").classList.add("active");
}

let qtyValue = 1;

document.getElementById("qtyMinus").addEventListener("click", () => {
  qtyValue = Math.max(1, qtyValue - 1);
  document.getElementById("qtyValue").textContent = qtyValue;
});

document.getElementById("qtyPlus").addEventListener("click", () => {
  qtyValue++;
  document.getElementById("qtyValue").textContent = qtyValue;
});
/* -------------------------------
   Delete Item
--------------------------------*/
function deleteItem(id, button) {
  const originalText = button.textContent;

  if (button.textContent === "🗑️ Delete") {
    button.textContent = "✓ Confirm?";
    button.style.background = "rgba(255, 221, 240, 0.5)";

    setTimeout(() => {
      button.textContent = originalText;
      button.style.background = "";
    }, 3000);

    return;
  }

  const index = items.findIndex((i) => i.id === id);
  if (index > -1) {
    items.splice(index, 1);
    if (saveToLocalStorage()) {
      showToast("Item deleted");
      renderChecklist();
      updateProgress();
    }
  }
}

/* -------------------------------
   View Notes
--------------------------------*/
function viewNotes(id) {
  const item = items.find((i) => i.id === id);
  if (!item || !item.notes) return;

  document.getElementById("notesContent").textContent = item.notes;
  document.getElementById("notesModal").classList.add("active");
}

/* -------------------------------
   View Image
--------------------------------*/
function viewImage(id) {
  const item = items.find((i) => i.id === id);
  if (!item || !item.imageData) return;

  document.getElementById("imageViewer").src = item.imageData;
  document.getElementById("imageModal").classList.add("active");
}

/* -------------------------------
   Image Upload Preview
--------------------------------*/
document.getElementById("itemImage").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.match("image/jpeg") && !file.type.match("image/png")) {
    showToast("Please upload a JPG or PNG image");
    return;
  }

  const reader = new FileReader();
  reader.onload = (event) => {
    const preview = document.getElementById("imagePreview");
    preview.src = event.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

/* -------------------------------
   Add Item Button
--------------------------------*/
document.getElementById("addItemBtn").addEventListener("click", () => {
  openItemModal(null);
});

/* -------------------------------
   Save Item (Add or Edit)
--------------------------------*/
document.getElementById("itemForm").addEventListener("submit", (e) => {
  e.preventDefault();

  const title = document.getElementById("itemTitle").value.trim();
  const category = document.getElementById("itemCategory").value;
  const price = document.getElementById("itemPrice").value.trim();
  const quantity = qtyValue;
  const url = document.getElementById("itemUrl").value.trim();
  const mustHave = document.getElementById("itemMustHave").checked;
  const description = document.getElementById("itemDescription").value.trim();
  const notes = document.getElementById("itemNotes").value.trim();

  const preview = document.getElementById("imagePreview");
  const imageData = preview.style.display === "block" ? preview.src : "";

  const saveBtn = document.getElementById("saveItemBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  if (editingItemId) {
    const item = items.find((i) => i.id === editingItemId);
    if (item) {
      item.title = title;
      item.category = category;
      item.price = price;
      item.quantity = quantity;
      item.url = url;
      item.mustHave = mustHave;
      item.description = description;
      item.notes = notes;
      item.imageData = imageData;

      if (saveToLocalStorage()) {
        renderChecklist();
        updateProgress();
        showToast("Item updated successfully!");
        document.getElementById("itemModal").classList.remove("active");
      }
    }
  } else {
    const newItem = {
      id: Date.now().toString(),
      title,
      category,
      price,
      quantity,
      url,
      mustHave,
      description,
      notes,
      imageData,
      checked: false,
      order: items.length,
      createdAt: new Date().toISOString(),
    };

    items.push(newItem);

    if (saveToLocalStorage()) {
      renderChecklist();
      updateProgress();
      showToast("Item added successfully!");
      document.getElementById("itemModal").classList.remove("active");
      document.getElementById("itemForm").reset();
      preview.style.display = "none";
    } else {
      items.pop();
    }
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "Save Item";
});

/* -------------------------------
   Category Filter
--------------------------------*/
document.getElementById("categoryFilter").addEventListener("click", (e) => {
  if (e.target.classList.contains("category-tag")) {
    document.querySelectorAll(".category-tag").forEach((tag) => tag.classList.remove("active"));
    e.target.classList.add("active");

    currentFilter = e.target.dataset.category;
    renderChecklist();
  }
});

/* -------------------------------
   Clear All Items
--------------------------------*/
document.getElementById("clearAllBtn").addEventListener("click", () => {
  if (items.length === 0) return;

  const btn = document.getElementById("clearAllBtn");
  const originalText = btn.innerHTML;

  if (btn.innerHTML.includes("Clear All")) {
    btn.innerHTML = "✓ Confirm Clear?";
    btn.style.background = "linear-gradient(135deg, #ef9a9a 0%, #e57373 100%)";

    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.style.background = "";
    }, 3000);

    return;
  }

  items = [];
  if (saveToLocalStorage()) {
    renderChecklist();
    updateProgress();
    showToast("All items cleared");
  }
});

/* -------------------------------
   Save Template
--------------------------------*/
document.getElementById("saveBtn").addEventListener("click", () => {
  if (items.length === 0) {
    showToast("No items to save");
    return;
  }

  const listName = prompt("Enter a name for this wishlist template:");
  if (!listName || !listName.trim()) {
    showToast("Please enter a valid name");
    return;
  }

  const templates = JSON.parse(localStorage.getItem("wishlistTemplates") || "[]");

  const newTemplate = {
    id: Date.now().toString(),
    name: listName.trim(),
    items: JSON.parse(JSON.stringify(items)),
    createdAt: new Date().toISOString(),
  };

  templates.push(newTemplate);
  localStorage.setItem("wishlistTemplates", JSON.stringify(templates));

  showToast(`Template "${listName}" saved successfully!`);
});

/* -------------------------------
   Export HTML (Print to PDF)
--------------------------------*/
document.getElementById("exportPdfBtn").addEventListener("click", () => {
  if (items.length === 0) {
    showToast("No items to export");
    return;
  }

  const total = items.length;
  const completed = items.filter((i) => i.checked).length;
  const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

  /* IMPORTANT:
     This entire HTML export is ONE template literal.
     It is fully contained inside this chunk.
     No breaks. No missing backticks.
  */
  const htmlContent = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wishlist Export</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 40px;
    color: #2c3e50;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  h1 { font-size: 32px; margin-bottom: 10px; }
  .meta { color:#546e7a; margin-bottom:20px; }
  .category-title {
    font-size: 22px;
    margin-top: 30px;
    padding: 10px;
    background: #e3f2fd;
    border-radius: 8px;
  }
  .item {
    border: 1px solid #ddd;
    padding: 16px;
    border-radius: 12px;
    margin-top: 12px;
    background: #fafafa;
  }
  .item img {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    margin-bottom: 10px;
  }
  .notes {
    margin-top: 10px;
    padding: 10px;
    background: #fff3cd;
    border-left: 4px solid #ffeb3b;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Wishlist</h1>
  <div class="meta">Generated: ${new Date().toLocaleString()}</div>

  <h2>Progress: ${completed} of ${total} items (${percentage}%)</h2>

  ${["Personal Care & Style","Technology","Home Decor","Drawing & Hobbies","Other"]
    .map(category => {
      const group = items.filter(i => i.category === category);
      if (group.length === 0) return "";
      return `
        <div class="category-title">${category}</div>
        ${group
          .map(item => `
            <div class="item">
              ${item.imageData ? `<img src="${item.imageData}">` : ""}
              <div><strong>${item.title}</strong></div>
              <div>${item.description || ""}</div>
              <div>Price: ${item.price || "-"}</div>
              <div>Qty: ${item.quantity || "1"}</div>
              <div>${item.url || ""}</div>
              ${item.mustHave ? `<div>⭐ Must Have</div>` : ""}
              ${
                item.notes
                  ? `<div class="notes"><strong>Notes:</strong> ${item.notes}</div>`
                  : ""
              }
            </div>
          `)
          .join("")}
      `;
    })
    .join("")}

</div>
</body>
</html>
`;

  const blob = new Blob([htmlContent], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `wishlist_${new Date().toISOString().split("T")[0]}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast("Exported! Open the HTML file and print to PDF.");
});

/* -------------------------------
   Templates Modal
--------------------------------*/
document.getElementById("templatesBtn").addEventListener("click", () => {
  const templates = JSON.parse(localStorage.getItem("wishlistTemplates") || "[]");
  const container = document.getElementById("templatesContainer");

  if (templates.length === 0) {
    container.innerHTML =
      '<p style="color:#546e7a;text-align:center;padding:20px;">No templates saved yet.</p>';
  } else {
    container.innerHTML = templates
      .map(
        (t) => `
      <div style="background:rgba(255,255,255,0.6);padding:16px;border-radius:12px;margin-bottom:12px;">
        <h3 style="margin:0 0 8px 0;">${t.name}</h3>
        <p style="margin:0 0 12px 0;color:#546e7a;">${t.items.length} items</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" data-load-template="${t.id}">Load</button>
          <button class="btn btn-danger" data-delete-template="${t.id}">Delete</button>
        </div>
      </div>
    `
      )
      .join("");
  }

  document.getElementById("templatesModal").classList.add("active");
});

/* -------------------------------
   Template Load/Delete
--------------------------------*/
document.getElementById("templatesContainer").addEventListener("click", (e) => {
  const loadBtn = e.target.closest("[data-load-template]");
  const deleteBtn = e.target.closest("[data-delete-template]");

  if (loadBtn) {
    const id = loadBtn.dataset.loadTemplate;
    const templates = JSON.parse(localStorage.getItem("wishlistTemplates") || "[]");
    const template = templates.find((t) => t.id === id);

    if (template) {
      items = JSON.parse(JSON.stringify(template.items));
      items.forEach((item, index) => {
        item.id = Date.now().toString() + index;
        item.order = index;
      });

      saveToLocalStorage();
      renderChecklist();
      updateProgress();
      showToast(`Template "${template.name}" loaded!`);
      document.getElementById("templatesModal").classList.remove("active");
    }
  }

  if (deleteBtn) {
    const id = deleteBtn.dataset.deleteTemplate;
    let templates = JSON.parse(localStorage.getItem("wishlistTemplates") || "[]");
    templates = templates.filter((t) => t.id !== id);
    localStorage.setItem("wishlistTemplates", JSON.stringify(templates));
    showToast("Template deleted");
    document.getElementById("templatesBtn").click();
  }
});

/* -------------------------------
   Settings
--------------------------------*/
document.getElementById("settingsBtn").addEventListener("click", () => {
  document.getElementById("settingsModal").classList.add("active");
});

document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark-mode") ? "dark" : "light"
  );
});

document.getElementById("themeSelect").addEventListener("change", (e) => {
  if (e.target.value === "dark") {
    document.body.classList.add("dark-mode");
  } else {
    document.body.classList.remove("dark-mode");
  }
  localStorage.setItem("theme", e.target.value);
});

document.getElementById("fontSizeSelect").addEventListener("change", (e) => {
  const size = e.target.value;
  document.documentElement.style.fontSize = size + "px";
  localStorage.setItem("fontSize", size);
});

/* -------------------------------
   Modal Close Buttons
--------------------------------*/
document.getElementById("cancelBtn").addEventListener("click", () => {
  document.getElementById("itemModal").classList.remove("active");
});

document.getElementById("closeNotesBtn").addEventListener("click", () => {
  document.getElementById("notesModal").classList.remove("active");
});

document.getElementById("closeImageBtn").addEventListener("click", () => {
  document.getElementById("imageModal").classList.remove("active");
});

document.getElementById("closeTemplatesBtn").addEventListener("click", () => {
  document.getElementById("templatesModal").classList.remove("active");
});

document.getElementById("closeSettingsBtn").addEventListener("click", () => {
  document.getElementById("settingsModal").classList.remove("active");
});

/* -------------------------------
   Close Modal on Background Click
--------------------------------*/
document.querySelectorAll(".modal-overlay").forEach((overlay) => {
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.classList.remove("active");
  });
});

/* -------------------------------
   Event Delegation for Checklist
--------------------------------*/
document.getElementById("checklistContainer").addEventListener("click", (e) => {
  const checkbox = e.target.closest(".checkbox");
  if (checkbox) {
    toggleItem(checkbox.dataset.id);
    return;
  }

  const notesBtn = e.target.closest("[data-view-notes]");
  if (notesBtn) {
    viewNotes(notesBtn.dataset.viewNotes);
    return;
  }

  const editBtn = e.target.closest("[data-edit-item]");
  if (editBtn) {
    const item = items.find((i) => i.id === editBtn.dataset.editItem);
    if (item) openItemModal(item);
    return;
  }

  const deleteBtn = e.target.closest("[data-delete-item]");
  if (deleteBtn) {
    deleteItem(deleteBtn.dataset.deleteItem, deleteBtn);
    return;
  }

  const img = e.target.closest("[data-view-image]");
  if (img) {
    viewImage(img.dataset.viewImage);
    return;
  }
});

/* -------------------------------
   Load Saved Theme + Font
--------------------------------*/
const savedTheme = localStorage.getItem("theme");
if (savedTheme === "dark") {
  document.body.classList.add("dark-mode");
  document.getElementById("themeSelect").value = "dark";
}

const savedFontSize = localStorage.getItem("fontSize");
if (savedFontSize) {
  document.documentElement.style.fontSize = savedFontSize + "px";
  document.getElementById("fontSizeSelect").value = savedFontSize;
}

/* -------------------------------
   Initialize App
--------------------------------*/
function initializeApp() {
  loadFromLocalStorage();
}

initializeApp();
</script>
</body>
</html>
